[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyml-deployer"
version = "0.2.0.dev0"
description = "Validate and quantize models, generate ESP-IDF firmware, and profile TinyML inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Alex Odhiambo Haya", email = "alexhaya4@gmail.com" },
]
keywords = ["tinyml", "tflite", "esp32", "stm32", "microcontroller", "edge-ai", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "tensorflow==2.19.1",
    "numpy>=1.26,<2.2",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
emulation = ["esptool==4.12.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "ruff>=0.11",
]
onnx = [
    "onnx==1.17.0",
    "onnx2tf==1.28.8",
    "onnxruntime==1.20.1",
    "tf-keras==2.19.0",
    "onnx-graphsurgeon==0.5.8",
    "sng4onnx==1.0.4",
    "psutil>=5.9,<8",
    "ai-edge-litert==1.2.0",
]

[project.urls]
Homepage = "https://github.com/alexhaya4/tinyml-deployer"
Repository = "https://github.com/alexhaya4/tinyml-deployer"
Issues = "https://github.com/alexhaya4/tinyml-deployer/issues"

[project.scripts]
tinyml-deployer = "tinyml_deployer.cli:cli"

[tool.setuptools.packages.find]
include = ["tinyml_deployer*"]

[tool.setuptools.package-data]
tinyml_deployer = ["templates/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
